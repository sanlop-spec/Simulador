<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Rendimiento Académico & Simulador</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM CDNs (Versión 18 Estable) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts CDN (Versión Estable UMD) -->
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <div id="root"></div>

  <script type="text/babel">
    // Detección segura de Recharts desde window
    const RechartsLib = window.Recharts || window.recharts;
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell, ReferenceLine } = RechartsLib;
    const { useState, useEffect, useMemo } = React;

    // --- DATOS INICIALES ---
    const INITIAL_SUBJECTS = [
      {
        id: 'sub-1',
        name: 'Cálculo Multivariable',
        code: 'MAT-301',
        targetGrade: 9.8,
        minPassingGrade: 7.0,
        maxGrade: 10,
        assessments: [
          { id: 'a1', name: 'Parcial 1', weight: 30, score: 10.0 },
          { id: 'a2', name: 'Parcial 2', weight: 30, score: 9.5 },
          { id: 'a3', name: 'Examen Final', weight: 40, score: null },
        ],
      },
      {
        id: 'sub-2',
        name: 'Estructuras de Datos',
        code: 'INF-202',
        targetGrade: 10.0,
        minPassingGrade: 7.0,
        maxGrade: 10,
        assessments: [
          { id: 'a4', name: 'Proyecto Práctico', weight: 40, score: 10.0 },
          { id: 'a5', name: 'Algoritmos y Grafos', weight: 30, score: 9.8 },
          { id: 'a6', name: 'Examen Teórico', weight: 30, score: null },
        ],
      }
    ];

    // --- LÓGICA MATEMÁTICA ---
    function calculateSubjectSummary(subject) {
      let accumulatedScore = 0;
      let evaluatedWeight = 0;

      subject.assessments.forEach((assessment) => {
        if (assessment.score !== null && !isNaN(assessment.score)) {
          accumulatedScore += (assessment.score * assessment.weight) / 100;
          evaluatedWeight += assessment.weight;
        }
      });

      const currentWeightedGrade = evaluatedWeight > 0 
        ? Number(((accumulatedScore / evaluatedWeight) * subject.maxGrade).toFixed(2)) 
        : 0;

      const remainingWeight = 100 - evaluatedWeight;
      let requiredScoreForTarget = null;
      let isTargetAchievable = true;

      if (remainingWeight > 0) {
        const targetAccumulated = (subject.targetGrade / subject.maxGrade) * 100;
        const neededFromRemaining = targetAccumulated - accumulatedScore;
        const requiredScore = (neededFromRemaining / remainingWeight) * subject.maxGrade;

        requiredScoreForTarget = Number(requiredScore.toFixed(2));
        if (requiredScoreForTarget > subject.maxGrade || requiredScoreForTarget < 0) {
          isTargetAchievable = requiredScoreForTarget <= subject.maxGrade && requiredScoreForTarget >= 0;
        }
      }

      return {
        currentWeightedGrade,
        evaluatedWeight,
        remainingWeight,
        requiredScoreForTarget,
        isTargetAchievable,
      };
    }

    function calculateGlobalMetrics(subjects) {
      if (!subjects || subjects.length === 0) return { overallGPA: 0, totalSubjects: 0, passedSubjectsCount: 0, completedPercentage: 0 };

      let totalGPA = 0;
      let passedCount = 0;
      let totalEvaluatedWeight = 0;

      subjects.forEach((subj) => {
        const summary = calculateSubjectSummary(subj);
        totalGPA += summary.currentWeightedGrade;
        totalEvaluatedWeight += summary.evaluatedWeight;
        if (summary.currentWeightedGrade >= subj.minPassingGrade) passedCount++;
      });

      return {
        overallGPA: Number((totalGPA / subjects.length).toFixed(2)),
        totalSubjects: subjects.length,
        passedSubjectsCount: passedCount,
        completedPercentage: Number((totalEvaluatedWeight / subjects.length).toFixed(1)),
      };
    }

    // --- COMPONENTE APP ---
    function App() {
      const [subjects, setSubjects] = useState(() => {
        try {
          const saved = localStorage.getItem('academic_app_data');
          return saved ? JSON.parse(saved) : INITIAL_SUBJECTS;
        } catch (e) {
          return INITIAL_SUBJECTS;
        }
      });

      useEffect(() => {
        localStorage.setItem('academic_app_data', JSON.stringify(subjects));
      }, [subjects]);

      const metrics = useMemo(() => calculateGlobalMetrics(subjects), [subjects]);

      const updateAssessmentScore = (subjectId, assessmentId, score) => {
        setSubjects((prev) =>
          prev.map((subj) => {
            if (subj.id !== subjectId) return subj;
            return {
              ...subj,
              assessments: subj.assessments.map((a) => (a.id === assessmentId ? { ...a, score } : a)),
            };
          })
        );
      };

      const chartData = subjects.map((subj) => {
        const summary = calculateSubjectSummary(subj);
        return {
          name: subj.name,
          promedio: summary.currentWeightedGrade,
          meta: subj.targetGrade,
        };
      });

      return (
        <div className="p-6 max-w-7xl mx-auto space-y-8">
          {/* Encabezado */}
          <header className="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
              <h1 className="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                Dashboard de Rendimiento Académico
              </h1>
              <p className="text-slate-400 text-sm mt-1">Cálculo de promedios ponderados y simulador predictivo</p>
            </div>
            <span className="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full text-xs font-semibold">
              GitHub Pages Ready
            </span>
          </header>

          {/* Tarjetas KPI */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <span className="text-slate-400 text-sm font-medium">Promedio General (GPA)</span>
              <p className="text-3xl font-extrabold text-white mt-1">{metrics.overallGPA} <span className="text-sm font-normal text-slate-400">/ 10</span></p>
            </div>
            <div className="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <span className="text-slate-400 text-sm font-medium">Materias Registradas</span>
              <p className="text-3xl font-extrabold text-white mt-1">{metrics.totalSubjects}</p>
            </div>
            <div className="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <span className="text-slate-400 text-sm font-medium">Materias Aprobadas</span>
              <p className="text-3xl font-extrabold text-emerald-400 mt-1">{metrics.passedSubjectsCount}</p>
            </div>
            <div className="bg-slate-800/60 border border-slate-700/50 p-5 rounded-xl">
              <span className="text-slate-400 text-sm font-medium">Avance Total del Periodo</span>
              <p className="text-3xl font-extrabold text-amber-400 mt-1">{metrics.completedPercentage}%</p>
            </div>
          </div>

          {/* Gráfico Recharts */}
          <div className="bg-slate-800/60 border border-slate-700/50 p-6 rounded-xl">
            <h2 className="text-xl font-bold mb-4 text-slate-200">Promedio Actual por Materia</h2>
            <div className="h-64 w-full">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={chartData} margin={{ top: 10, right: 30, left: 0, bottom: 0 }}>
                  <XAxis dataKey="name" stroke="#94a3b8" />
                  <YAxis domain={[0, 10]} stroke="#94a3b8" />
                  <Tooltip 
                    contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px', color: '#fff' }}
                  />
                  <ReferenceLine y={7} label="Aprobatorio" stroke="#ef4444" strokeDasharray="3 3" />
                  <Bar dataKey="promedio" radius={[6, 6, 0, 0]}>
                    {chartData.map((entry, index) => (
                      <Cell key={`cell-${index}`} fill={entry.promedio >= 8.5 ? '#3b82f6' : entry.promedio >= 7.0 ? '#10b981' : '#f59e0b'} />
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* Materias y Simulador */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {subjects.map((subject) => {
              const summary = calculateSubjectSummary(subject);
              return (
                <div key={subject.id} className="bg-slate-800/60 border border-slate-700/50 p-6 rounded-xl space-y-4">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-700 text-slate-300">{subject.code}</span>
                      <h3 className="text-lg font-bold text-white mt-1">{subject.name}</h3>
                    </div>
                    <div className="text-right">
                      <span className="text-2xl font-black text-blue-400">{summary.currentWeightedGrade}</span>
                      <p className="text-xs text-slate-400">Meta: {subject.targetGrade}</p>
                    </div>
                  </div>

                  {summary.remainingWeight > 0 && (
                    <div className="p-3 bg-indigo-950/40 border border-indigo-500/20 rounded-lg text-xs">
                      <span className="text-indigo-300 font-semibold">Simulador de Meta: </span>
                      {summary.isTargetAchievable ? (
                        <span className="text-slate-300">
                          Necesitas promedio de <strong className="text-emerald-400">{summary.requiredScoreForTarget}</strong> en el {summary.remainingWeight}% restante para alcanzar tu meta.
                        </span>
                      ) : (
                        <span className="text-rose-400">
                          Matemáticamente inalcanzable (Requeriría {summary.requiredScoreForTarget}).
                        </span>
                      )}
                    </div>
                  )}

                  <div className="space-y-3">
                    <h4 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Evaluaciones</h4>
                    {subject.assessments.map((assessment) => (
                      <div key={assessment.id} className="flex justify-between items-center bg-slate-900/50 p-2.5 rounded-lg border border-slate-800">
                        <div>
                          <p className="text-sm font-medium text-slate-200">{assessment.name}</p>
                          <span className="text-xs text-slate-500">Ponderación: {assessment.weight}%</span>
                        </div>
                        <input
                          type="number"
                          min="0"
                          max="10"
                          step="0.1"
                          placeholder="Sin nota"
                          value={assessment.score ?? ''}
                          onChange={(e) => {
                            const val = e.target.value === '' ? null : parseFloat(e.target.value);
                            updateAssessmentScore(subject.id, assessment.id, val);
                          }}
                          className="w-20 bg-slate-800 border border-slate-700 text-white text-sm rounded px-2 py-1 text-right focus:outline-none focus:border-blue-500"
                        />
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
